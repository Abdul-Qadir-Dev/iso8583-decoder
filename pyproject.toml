[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iso8583-decoder"
version = "0.1.0"
description = "ISO 8583 payment message decoder with plain-language diagnostics, built for payments support and fintech troubleshooting."
requires-python = ">=3.12"
# Runtime dependencies only -- checked against actual imports in
# iso8583_decoder/*.py, not copied from requirements.txt wholesale.
# uvicorn isn't imported by the package itself (Vercel hosts the ASGI
# app directly and never shells out to it), but it's what actually
# runs the service locally and in the Dockerfile, so it stays here
# rather than in the dev-only group.
dependencies = [
    "fastapi==0.115.14",
    "uvicorn==0.32.1",
    "pydantic==2.9.2",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
# Test/lint tooling only -- never needed to run the service, so this
# group is what requirements-dev.txt installs on top of the runtime
# deps, and what Vercel's build never sees.
dev = [
    "pytest==8.3.3",
    "httpx==0.27.2",
    "pyflakes==3.4.0",
]

[tool.setuptools]
packages = ["iso8583_decoder"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.vercel]
# The app lives at iso8583_decoder/api.py, not one of Vercel's auto-detected
# entrypoint filenames (app.py/index.py/server.py/main.py/wsgi.py/asgi.py),
# so this points Vercel at the existing FastAPI instance directly instead of
# adding a duplicate entrypoint file.
entrypoint = "iso8583_decoder.api:app"
